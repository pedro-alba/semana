[project]
name = "semana"
version = "0.1.0"
description = "Notes and tasks, one week at a time."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "nh3"]

[dependency-groups]
dev = ["pytest", "httpx", "pytest-playwright", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semana"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
